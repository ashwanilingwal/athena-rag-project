# Day 1 needs postgres. redis and ollama are here because Day 2 and the real
# generator need them, and a reviewer should never have to add services by hand.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: athena
      POSTGRES_PASSWORD: athena
      POSTGRES_DB: athena
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only on first boot of an empty volume. Flyway owns this in the Java
      # module; this file is the standalone-Python-dev path.
      - ./athena-rag/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athena -d athena"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes:
      - ollama:/root/.ollama
    # After first up:  docker compose exec ollama ollama pull nomic-embed-text
    #                  docker compose exec ollama ollama pull llama3.2

  rag:
    build: ./athena-rag
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      ATHENA_DSN: postgresql://athena:athena@postgres:5432/athena
      OLLAMA_HOST: http://ollama:11434
      EMBED_PROVIDER: ${EMBED_PROVIDER:-ollama}
    ports: ["50051:50051"]
    volumes:
      - ./corpus:/corpus:ro

volumes:
  pgdata:
  ollama:
